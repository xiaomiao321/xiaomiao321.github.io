<style>

progress i{display:block;height:100%;background:#1d6f5f}.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid #dfe3e7;border-radius:6px;background:#fff;margin-bottom:20px}.stat{padding:15px 17px;border-right:1px solid #e5e8eb}.stat:last-child{border:0}.stat b{display:block;font-size:23px}.stat span{font-size:11px;color:#7d8792}.toolbar{display:flex;gap:9px;margin-bottom:14px}.search{flex:1;min-width:180px;height:38px;padding:0 12px;border:1px solid #d8dde2;border-radius:5px;background:#fff;outline:none}.search:focus{border-color:#609589}.bag-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.bag{min-width:0;border:1px solid #dfe3e7;border-radius:6px;background:#fff;overflow:hidden}.bag-head{display:flex;align-items:center;gap:11px;padding:15px 16px;border-bottom:1px solid #e6e9ec}.bag-icon{display:grid;place-items:center;width:31px;height:31px;border:1px solid #d9dee3;border-radius:5px;color:#65707c}.bag-head b{font-size:14px}.bag-head span{display:block;color:#8a939d;font-size:11px}.bag-head .count{margin-left:auto}.zone{border-bottom:1px solid #edf0f2}.zone:last-child{border:0}.zone-title{padding:9px 14px;background:#fafbfb;color:#7a8490;font-size:10px;font-weight:800;letter-spacing:.07em}.item{display:grid;grid-template-columns:20px minmax(0,1fr) auto auto;align-items:center;gap:9px;padding:10px 14px;border-top:1px solid #f0f1f3}.check{width:16px;height:16px;accent-color:#1d6f5f}.item-name{min-width:0;font-size:13px}.item-name.done{text-decoration:line-through;color:#9098a1}.item-note{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#9199a2;font-size:10px}.qty{font:11px ui-monospace,Consolas,monospace;color:#77818c}.empty{padding:18px 14px;color:#a0a7af;font-size:12px}.footnote{margin-top:18px;color:#9098a1;font-size:11px}.delete{border:0;background:transparent;color:#a05252;font-size:10px}dialog{width:min(600px,calc(100% - 28px));padding:0;border:1px solid #d8dde2;border-radius:7px;background:#fff;color:#202833;box-shadow:0 18px 55px rgba(15,23,42,.2)}dialog::backdrop{background:rgba(24,31,40,.42)}.dlg-head{padding:18px 20px;border-bottom:1px solid #e3e6e9;font-size:17px;font-weight:750}.dlg-body{display:grid;gap:14px;padding:20px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field label{display:block;margin-bottom:6px;color:#687380;font-size:11px;font-weight:650}.field input,.field select{width:100%;height:40px;padding:0 10px;border:1px solid #d7dce1;border-radius:5px;background:#fff;outline:none}.dlg-foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid #e3e6e9;background:#fafbfb}.route{font-family:ui-monospace,Consolas,monospace}@media(max-width:1000px){.bag-grid{grid-template-columns:1fr}.progress-wrap{width:210px}}@media(max-width:720px){.layout{display:block}.sidebar{border-right:0;border-bottom:1px solid #e1e4e8}.trip-list{display:flex;overflow:auto}.trip-btn{min-width:170px}.content{padding:20px 16px 60px}.hero{display:block}.progress-wrap{width:100%;margin-top:18px}.summary{grid-template-columns:repeat(2,1fr)}.toolbar{flex-wrap:wrap}.search{flex-basis:100%}.topbar{padding:0 16px}.grid2{grid-template-columns:1fr}}
</style><style>
:root{color-scheme:dark}html,body{color:#f0f6fc;background:#010409}.topbar{background:#0d1117;border-color:#30363d}.mark{background:#f0f6fc;color:#010409}.brand small,.trip-btn span,.hero p,.progress-meta,.stat span,.bag-head span,.item-note,.qty,.footnote,.empty{color:#8b949e}.btn,.search,.field input,.field select{border-color:#30363d;background:#0d1117;color:#f0f6fc}.btn:hover{background:#161b22}.btn.primary{border-color:#238636;background:#238636}.layout{background:#010409}.sidebar{background:#0d1117;border-color:#30363d}.trip-btn{color:#c9d1d9}.trip-btn:hover{background:#161b22}.trip-btn.active{background:#1f2937;color:#58a6ff}.eyebrow{color:#58a6ff}.progress{background:#21262d}.progress i{background:#3fb950}.summary,.bag{border-color:#30363d;background:#0d1117}.stat,.bag-head,.zone,.item{border-color:#30363d}.zone-title{background:#161b22;color:#8b949e}.bag-icon{border-color:#30363d;color:#c9d1d9}.check{accent-color:#238636}.delete{color:#ff7b72}.bag-edit{margin-left:8px;border:0;background:transparent;color:#58a6ff;font-size:11px}.item-name.done{color:#6e7681}dialog{border-color:#8b949e;background:#0d1117;color:#f0f6fc;box-shadow:0 24px 80px rgba(0,0,0,.7)}dialog::backdrop{background:rgba(1,4,9,.78)}.dlg-head,.dlg-foot{border-color:#30363d}.dlg-foot{background:#010409}.field label{color:#8b949e}.field input:focus,.field select:focus,.search:focus{border-color:#58a6ff}.side-title{color:#8b949e}.bag-tools{display:flex;align-items:center;margin-left:auto}.bag-head .count{margin-left:0}.danger{border-color:#da3633;color:#ff7b72}.hint{margin:0;color:#8b949e;font-size:11px;line-height:1.6}
</style></head><body><div class="app">
<header class="topbar"><div class="mark">行</div><div class="brand">旅行装包<small id="dataStatus">正在读取 travel.json</small></div><div class="spacer"></div><button class="btn" id="commitData">提交到 GitHub</button><button class="btn" id="manageBags">管理行李</button><button class="btn" id="newTrip">新增旅程</button><button class="btn primary" id="newItem">添加物品</button></header>
<div class="layout"><aside class="sidebar"><div class="side-title"><span>旅程</span><span id="tripCount"></span></div><div class="trip-list" id="tripList"></div></aside><main class="content"><section class="hero"><div><div class="eyebrow">当前旅程</div><h1 id="tripTitle"></h1><p><span class="route" id="tripRoute"></span>　·　<span id="tripDate"></span></p></div><div class="progress-wrap"><div class="progress-meta"><span>装包进度</span><b id="progressText">0 / 0</b></div><div class="progress"><i id="progressBar"></i></div></div></section><section class="summary"><div class="stat"><b id="sTotal">0</b><span>物品</span></div><div class="stat"><b id="sPacked">0</b><span>已装入</span></div><div class="stat"><b id="sLeft">0</b><span>待装入</span></div><div class="stat"><b id="sBags">0</b><span>行李件数</span></div></section><div class="toolbar"><input class="search" id="search" placeholder="搜索物品或备注"><select class="btn" id="status"><option value="">全部状态</option><option value="todo">待装入</option><option value="done">已装入</option></select><button class="btn" id="resetDemo">恢复仓库数据</button></div><section class="bag-grid" id="bagGrid"></section><div class="footnote">公开数据读取自 <code>data/travel.json</code>；修改会先暂存在当前浏览器，提交到 GitHub 后永久保存并触发重新部署。</div></main></div></div>
<dialog id="tripDlg"><div class="dlg-head">新增旅程</div><div class="dlg-body"><div class="field"><label>旅程名称 *</label><input id="tName" placeholder="例如：暑假回家"></div><div class="grid2"><div class="field"><label>出发地 *</label><input id="tFrom" placeholder="宁波"></div><div class="field"><label>目的地 *</label><input id="tTo" placeholder="天津"></div></div><div class="field"><label>出发日期</label><input id="tDate" type="date"></div></div><div class="dlg-foot"><button class="btn" data-close="tripDlg">取消</button><button class="btn primary" id="saveTrip">保存旅程</button></div></dialog>
<dialog id="itemDlg"><div class="dlg-head">添加旅行物品</div><div class="dlg-body"><div class="grid2"><div class="field"><label>物品名称 *</label><input id="iName" placeholder="例如：充电器"></div><div class="field"><label>数量</label><input id="iQty" type="number" min="1" value="1"></div></div><div class="grid2"><div class="field"><label>放入 *</label><select id="iBag"></select></div><div class="field"><label>具体分区 *</label><select id="iZone"></select></div></div><div class="field"><label>备注</label><input id="iNote" placeholder="例如：出发当天再装"></div></div><div class="dlg-foot"><button class="btn" data-close="itemDlg">取消</button><button class="btn primary" id="saveItem">添加物品</button></div></dialog>
<dialog id="bagDlg"><div class="dlg-head" id="bagDlgTitle">新增行李</div><div class="dlg-body"><div class="grid2"><div class="field"><label>行李名称 *</label><input id="bName" placeholder="例如：电脑书包"></div><div class="field"><label>类型 *</label><select id="bType"><option value="行李箱">行李箱</option><option value="背包">背包 / 书包</option><option value="随身包">随身包</option><option value="其他">其他</option></select></div></div><div class="field"><label>袋子 / 分区名称 *</label><input id="bZones" placeholder="用逗号分隔，例如：主仓, 电脑仓, 前袋, 侧袋"></div><p class="hint">每件行李单独管理。要增加第二个书包，请再新增一件并给它单独命名。</p></div><div class="dlg-foot"><button class="btn danger" id="deleteBag" hidden>删除行李</button><span style="flex:1"></span><button class="btn" data-close="bagDlg">取消</button><button class="btn primary" id="saveBag">保存行李</button></div></dialog>
<dialog id="tokenDlg"><div class="dlg-head">提交旅行数据</div><div class="dlg-body"><p class="hint">使用与器件管理相同的 GitHub Token。Token 仅保存在当前浏览器，需要源码仓库 Contents 读写权限。</p><div class="field"><label>GitHub Token</label><input id="tokenInput" type="password" placeholder="github_pat_…"></div></div><div class="dlg-foot"><button class="btn" data-close="tokenDlg">取消</button><button class="btn primary" id="saveToken">保存并提交</button></div></dialog>
<script>
const $=id=>document.getElementById(id),KEY="travel_packing_preview_v1",LOCAL_JSON="../data/travel.json",GH={owner:"xiaomiao321",repo:"xiaomiao321.github.io",branch:"source",path:"source/data/travel.json"};
const DEFAULT_BAGS=[{id:"case",name:"行李箱",type:"行李箱",icon:"▣",zones:["上层","下层","网袋"]},{id:"bag1",name:"电脑书包",type:"背包",icon:"▤",zones:["主仓","电脑仓","前袋","侧袋"]},{id:"bag2",name:"随身书包",type:"背包",icon:"▥",zones:["主仓","内袋","前袋","侧袋"]}];
const DEMO={active:"trip-home",bags:DEFAULT_BAGS,trips:[{id:"trip-home",name:"回家",from:"宁波",to:"天津",date:"日期待定",items:[{id:1,name:"换洗衣物",qty:3,bag:"case",zone:"下层",note:"按天数调整",done:false},{id:2,name:"洗漱用品",qty:1,bag:"case",zone:"网袋",note:"液体注意密封",done:false},{id:3,name:"笔记本电脑",qty:1,bag:"bag1",zone:"电脑仓",note:"随身携带",done:true},{id:4,name:"电脑充电器",qty:1,bag:"bag1",zone:"主仓",note:"和电脑放一起",done:true},{id:5,name:"证件与钱包",qty:1,bag:"bag2",zone:"内袋",note:"方便取用",done:false},{id:6,name:"水杯",qty:1,bag:"bag2",zone:"侧袋",note:"出发前装水",done:false}]}]};
let state=load(),editingBag=null,fileSha=null;function load(){try{const data=JSON.parse(localStorage.getItem(KEY))||structuredClone(DEMO);data.bags=data.bags||structuredClone(DEFAULT_BAGS);return data}catch(e){return structuredClone(DEMO)}}function save(){localStorage.setItem(KEY,JSON.stringify(state));setDataStatus("本地草稿 · 尚未提交")}function active(){return state.trips.find(x=>x.id===state.active)||state.trips[0]}function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function setDataStatus(text){$("dataStatus").textContent=text}function token(){return localStorage.getItem("parts_gh_token")||""}function ghHeaders(){return{"Authorization":"Bearer "+token(),"Accept":"application/vnd.github+json"}}function decodeB64(s){return decodeURIComponent(Array.from(atob(s.replace(/\n/g,"")),c=>"%"+c.charCodeAt(0).toString(16).padStart(2,"0")).join(""))}function encodeB64(s){return btoa(Array.from(new TextEncoder().encode(s),b=>String.fromCharCode(b)).join(""))}
async function loadRepository(force=false){if(!force&&localStorage.getItem(KEY)){setDataStatus("本地草稿 · 尚未提交");render();return}try{const r=await fetch(LOCAL_JSON+"?t="+Date.now());if(!r.ok)throw new Error(r.status);state=await r.json();setDataStatus("travel.json · 已同步");render()}catch(e){state=structuredClone(DEMO);setDataStatus("travel.json 读取失败 · 使用初始数据");render()}}
async function commitRepository(){const button=$("commitData");button.disabled=true;button.textContent="提交中…";try{const url=`https://api.github.com/repos/${GH.owner}/${GH.repo}/contents/${GH.path}`;const current=await fetch(url+`?ref=${GH.branch}`,{headers:ghHeaders()});if(current.ok){const data=await current.json();fileSha=data.sha}else if(current.status!==404)throw new Error("读取仓库失败 "+current.status);const body={message:"travel: 更新旅行装包数据",content:encodeB64(JSON.stringify(state,null,2)+"\n"),branch:GH.branch};if(fileSha)body.sha=fileSha;const r=await fetch(url,{method:"PUT",headers:{...ghHeaders(),"Content-Type":"application/json"},body:JSON.stringify(body)});if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error(j.message||r.status)}const result=await r.json();fileSha=result.content.sha;localStorage.removeItem(KEY);setDataStatus("已提交 · 等待自动部署");alert("旅行数据已提交到 GitHub，稍后会自动部署。") }catch(e){alert("提交失败："+e.message)}finally{button.disabled=false;button.textContent="提交到 GitHub"}}
function render(){const trip=active();if(!trip)return;$("tripCount").textContent=state.trips.length;$("tripList").innerHTML=state.trips.map(t=>`<button class="trip-btn ${t.id===trip.id?"active":""}" data-trip="${t.id}"><b>${esc(t.name)}</b><span>${esc(t.from)} → ${esc(t.to)}</span></button>`).join("");$("tripTitle").textContent=trip.name;$("tripRoute").textContent=`${trip.from} → ${trip.to}`;$("tripDate").textContent=trip.date||"日期待定";const total=trip.items.length,packed=trip.items.filter(x=>x.done).length;$("sTotal").textContent=total;$("sPacked").textContent=packed;$("sLeft").textContent=total-packed;$("sBags").textContent=state.bags.length;$("progressText").textContent=`${packed} / ${total}`;$("progressBar").style.width=(total?packed/total*100:0)+"%";const q=$("search").value.trim().toLowerCase(),status=$("status").value;$("bagGrid").innerHTML=state.bags.map(b=>{const bagItems=trip.items.filter(x=>x.bag===b.id&&(!q||(x.name+" "+x.note).toLowerCase().includes(q))&&(!status||(status==="done")===x.done));return`<article class="bag"><header class="bag-head"><span class="bag-icon">${b.icon||"▣"}</span><div><b>${esc(b.name)}</b><span>${esc(b.type)} · ${b.zones.length} 个分区</span></div><div class="bag-tools"><span class="count">${bagItems.length} 项</span><button class="bag-edit" data-editbag="${b.id}">编辑</button></div></header><div>${b.zones.map(z=>{const items=bagItems.filter(x=>x.zone===z);return`<section class="zone"><div class="zone-title">${esc(z)}</div>${items.length?items.map(x=>`<div class="item"><input class="check" type="checkbox" data-check="${x.id}" ${x.done?"checked":""}><div class="item-name ${x.done?"done":""}">${esc(x.name)}<span class="item-note">${esc(x.note||"无备注")}</span></div><span class="qty">×${x.qty}</span><button class="delete" data-delete="${x.id}">删除</button></div>`).join(""):`<div class="empty">暂无物品</div>`}</section>`}).join("")}</div></article>`}).join("")||`<div class="empty">还没有行李，请先点击“管理行李”添加。</div>`}
function syncZones(){const bag=state.bags.find(x=>x.id===$("iBag").value)||state.bags[0];$("iZone").innerHTML=bag?bag.zones.map(z=>`<option>${esc(z)}</option>`).join(""):""}
function openBag(id=null){editingBag=id;const bag=id?state.bags.find(x=>x.id===id):null;$("bagDlgTitle").textContent=bag?"编辑行李":"新增行李";$("bName").value=bag?.name||"";$("bType").value=bag?.type||"行李箱";$("bZones").value=(bag?.zones||["主仓"]).join(", ");$("deleteBag").hidden=!bag;$("bagDlg").showModal();$("bName").focus()}
document.body.onclick=e=>{const trip=e.target.closest("[data-trip]"),check=e.target.closest("[data-check]"),del=e.target.closest("[data-delete]"),editBag=e.target.closest("[data-editbag]"),close=e.target.closest("[data-close]");if(trip){state.active=trip.dataset.trip;save();render()}if(check){const item=active().items.find(x=>String(x.id)===check.dataset.check);item.done=check.checked;save();render()}if(del){active().items=active().items.filter(x=>String(x.id)!==del.dataset.delete);save();render()}if(editBag)openBag(editBag.dataset.editbag);if(close)$(close.dataset.close).close()};
$("newTrip").onclick=()=>{$("tName").value="";$("tFrom").value="";$("tTo").value="";$("tDate").value="";$("tripDlg").showModal()};$("saveTrip").onclick=()=>{const name=$("tName").value.trim(),from=$("tFrom").value.trim(),to=$("tTo").value.trim();if(!name||!from||!to)return;const trip={id:"trip-"+Date.now(),name,from,to,date:$("tDate").value||"日期待定",items:[]};state.trips.push(trip);state.active=trip.id;save();$("tripDlg").close();render()};
$("manageBags").onclick=()=>openBag();
$("saveBag").onclick=()=>{const name=$("bName").value.trim(),type=$("bType").value,zones=$("bZones").value.split(/[,，\n]/).map(x=>x.trim()).filter(Boolean);if(!name||!zones.length)return;const icon=type==="行李箱"?"▣":type==="背包"?"▤":"▥";if(editingBag){const bag=state.bags.find(x=>x.id===editingBag),oldZones=bag.zones;Object.assign(bag,{name,type,zones,icon});for(const trip of state.trips)for(const item of trip.items)if(item.bag===bag.id&&!zones.includes(item.zone))item.zone=zones[0];}else state.bags.push({id:"bag-"+Date.now(),name,type,zones,icon});save();$("bagDlg").close();render()};
$("deleteBag").onclick=()=>{const bag=state.bags.find(x=>x.id===editingBag);if(!bag)return;const count=state.trips.reduce((n,t)=>n+t.items.filter(x=>x.bag===bag.id).length,0);if(!confirm(`删除“${bag.name}”以及其中关联的 ${count} 条物品记录？`))return;state.bags=state.bags.filter(x=>x.id!==bag.id);for(const trip of state.trips)trip.items=trip.items.filter(x=>x.bag!==bag.id);save();$("bagDlg").close();render()};
$("newItem").onclick=()=>{if(!state.bags.length){openBag();return;}$("iName").value="";$("iQty").value=1;$("iNote").value="";$("iBag").innerHTML=state.bags.map(b=>`<option value="${b.id}">${esc(b.name)}</option>`).join("");syncZones();$("itemDlg").showModal()};$("iBag").onchange=syncZones;$("saveItem").onclick=()=>{const name=$("iName").value.trim();if(!name)return;active().items.push({id:Date.now(),name,qty:Math.max(1,Number($("iQty").value)||1),bag:$("iBag").value,zone:$("iZone").value,note:$("iNote").value.trim(),done:false});save();$("itemDlg").close();render()};$("search").oninput=render;$("status").onchange=render;$("resetDemo").onclick=()=>{if(confirm("放弃本地草稿并重新读取仓库中的 travel.json？")){localStorage.removeItem(KEY);loadRepository(true)}};$("commitData").onclick=()=>{if(token())commitRepository();else $("tokenDlg").showModal()};$("saveToken").onclick=()=>{const value=$("tokenInput").value.trim();if(!value)return;localStorage.setItem("parts_gh_token",value);$("tokenDlg").close();commitRepository()};loadRepository();
</script></body></html>
